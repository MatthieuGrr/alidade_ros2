# Révision matérielle v1 d'Alidade.
#
# Ce fichier est LA source de toutes les constantes physiques du robot. Le
# xacro, controllers.yaml et nav2.yaml lisent ici ; aucune valeur ne doit être
# recopiée à la main ailleurs. Une révision v2 est un second fichier de ce
# format, sélectionné par l'argument hardware_revision, sans toucher au code.
#
# Les valeurs sont mesurées, pas déduites de fiches techniques — voir chaque
# section.

revision: v1

# Export URDF Onshape corrigé par scripts/fix_urdf.py, relatif à urdf/.
onshape_export: onshape/alidade.urdf

# ---------------------------------------------------------------------------
# Cinématique différentielle.
kinematics:
  # Les roues sont à y = ±0.0955 dans le modèle, et le plan médian du pneu
  # coïncide avec l'origine du link à 0.03 mm près : l'entraxe est bien 2 × 0.0955.
  #
  #
  # CALIBRÉ au sol (sept. 2026), le LiDAR servant de référence, ni SLAM ni IMU :
  #  - rayon : ICP 2D des scans avant/après une ligne de 0.4 m, initialisé par
  #    l'odométrie (rms ≈ 30 mm, insensible à l'initialisation). Deux sens :
  #    vrai/odom = 1.016 et 1.019 → rayon de roulement effectif 0.0326 m, le
  #    pneu chargé roule un peu plus grand que la cote CAO ;
  #  - entraxe : deux tours complets sur place, le profil de scan doit revenir
  #    sur lui-même, le décalage résiduel donne l'erreur. Avec r = 0.0320 :
  #    anti-horaire odom/vrai = 0.990 et 0.995, horaire 0.999 et 1.001. Le
  #    rapport r/L vrai vaut donc (0.0320/0.1910)/0.9965 ; avec le rayon
  #    calibré, L = 0.1939 m et les deux sens retombent à ±0.4 % autour de 1.
  #    L'asymétrie résiduelle entre sens est unilatérale (une roue ou un
  #    encodeur), ce n'est pas une constante.
  # La simulation suit : disques de collision au rayon effectif et décalés de
  # ±1.45 mm pour donner le même entraxe efficace (voir collisions).
  wheel_separation: 0.1939
  wheel_radius: 0.0326
  # 11 PPR × 4 (quadrature) × 34:1. MESURÉ sur 10 tours de roue à la main
  # (14 960 ticks) : le réducteur livré est en 34:1 et non 35:1. Se tromper
  # coûte 2.9 % sur les distances et 10° sur un tour complet du robot.
  counts_per_rev: 1496

# Motorisation, pour borner les consignes côté Pi : le firmware n'applique
# aucune limite et exécute la consigne telle quelle.
motor:
  rated_rpm: 170           # GA25-370 à 24 V, en sortie de réducteur
  # Vitesses de croisière retenues pour ce robot. Bien en deçà de la pleine
  # échelle (≈ 0.57 m/s à 170 tr/min), ce qui laisse de la marge au PID du Pico.
  max_linear_velocity: 0.40     # m/s
  max_angular_velocity: 2.50    # rad/s
  max_linear_acceleration: 1.0  # m/s²
  max_angular_acceleration: 3.5 # rad/s²

# ---------------------------------------------------------------------------
# Empreinte, depuis base_footprint — et surtout pas base_link : posé sur la
# platine 38 mm en arrière de l'axe, base_link donne un rayon circonscrit de
# 0.1856 m qui laisserait 3.5 cm d'avant hors du cercle de collision.
footprint:
  circumscribed_radius: 0.1481
  robot_radius: 0.15           # valeur nav2, arrondie au-dessus
  length: 0.209                # encombrement au sol, selon X
  width: 0.217                 # selon Y, pneus compris

# ---------------------------------------------------------------------------
# Poses attendues des repères principaux, exprimées depuis base_footprint.
# Ce ne sont PAS des valeurs d'entrée : la géométrie vient de l'export Onshape.
# fix_urdf.py vérifie que l'export les respecte et fait échouer le build sinon,
# pour qu'un réexport qui a bougé se voie immédiatement.
frames:
  tolerance: 0.001             # m
  expected:
    base_link:            [-0.0381,  0.0,     0.0531]
    wheel_left_link:      [ 0.0,     0.0955,  0.0325]
    wheel_right_link:     [ 0.0,    -0.0955,  0.0325]
    laser:                [ 0.0703,  0.0,     0.1797]
    imu_link:             [ 0.0,     0.0,     0.1317]
    camera_link:          [ 0.1076,  0.0,     0.1441]
    camera_optical_frame: [ 0.1451,  0.0,     0.1146]
    caster_wheel_link:    [ 0.0970,  0.0,     0.0111]

# ---------------------------------------------------------------------------
# Corrections propres à l'exporteur Onshape.

# Racine synthétique fabriquée par l'exporteur, sur laquelle la CAO ne donne
# aucune prise. base_footprint est au sol, au milieu de l'axe des roues.
rename_root:
  from: root
  to: base_footprint

# Onshape dérive le nom du link ET celui du joint du même mate connector.
# URDF tolère l'homonymie (deux espaces de noms), SDF n'en a qu'un : Gazebo
# rejette le modèle avec « frame with name [...] already exists ».
rename_joints:
  camera_optical_frame: camera_optical_joint

# Masses pesées à la balance, en kg. L'exporteur ne transmet pas les
# matériaux : tout sort à une densité de 1 kg/m³. Comme cette densité est
# uniforme, chaque tenseur d'inertie est juste à un facteur près, et le
# corriger revient à le multiplier par m_mesurée / m_exportée.
#
# Seuls les corps qui pèsent sont listés. Les autres links gardent leur masse
# d'export (quelques dixièmes de gramme) : ce sont des porteurs de repère dont
# la masse est déjà comptée dans base_link. Total : 1.598 kg.
masses:
  base_link: 1.051         # châssis complet : platines, moteurs, électronique, capteurs
  battery_link: 0.449
  wheel_left_link: 0.049   # jante + pneu
  wheel_right_link: 0.049

# Géométries de collision. L'export n'en produit aucune, et les maillages
# visuels (37 Mo) sont injouables dans un moteur physique.
# 'mu' est le coefficient de friction, utilisé uniquement en simulation.
collisions:
  base_link:
    shape: box
    size: [0.2087, 0.1730, 0.1863]
    origin: [0.0408, 0.0, 0.0973]
    mu: 0.2
  wheel_left_link:
    shape: cylinder
    # Rayon de roulement calibré (kinematics.wheel_radius), pas la cote CAO :
    # l'odométrie simulée doit voir la même roue que le contrôleur.
    radius: 0.0326
    # Disque fin volontairement : le solveur résout le contact cylindre/plan sur
    # un bord du cylindre, pas sous l'axe. Avec la largeur réelle du pneu
    # (26 mm) l'entraxe efficace tombait à 0.1646 m au lieu de 0.1910, soit
    # 13.8 % d'erreur en rotation. À 4 mm, l'erreur retombe à 2.0 %.
    length: 0.004
    # Décalé vers l'extérieur pour porter l'entraxe simulé à l'entraxe calibré
    # (kinematics.wheel_separation) alors que la CAO place les roues à ±0.0955.
    origin: [0.0, 0.00145, 0.0]
    rpy: [1.5708, 0.0, 0.0]   # l'axe d'un cylindre URDF est Z, la roue tourne sur Y
    mu: 1.2
  wheel_right_link:
    shape: cylinder
    radius: 0.0326
    length: 0.004
    origin: [0.0, -0.00145, 0.0]
    rpy: [1.5708, 0.0, 0.0]
    mu: 1.2
  caster_wheel_link:
    shape: sphere
    radius: 0.0110           # bille Ø 22 mm
    mu: 0.01                 # glisse au lieu de freiner en virage

# ---------------------------------------------------------------------------
# Capteurs.

# RPLIDAR C1 (C1M1-R2), datasheet Slamtec v1.0. Mesure depuis le centre du
# rotor : le repère est sur l'axe, la position vient donc de l'export.
# La datasheet définit un repère gaucher (angle croissant en sens horaire) ;
# rplidar_ros convertit vers la convention ROS, rien à corriger de ce côté.
lidar:
  frame: laser
  # Orientation du repère de MESURE, que la CAO ne connaît pas : elle place le
  # capteur, mais ne dit pas où tombe son 0°. Sur cet exemplaire il pointe vers
  # l'arrière du robot, à l'opposé de ce qu'on avait supposé.
  #
  # MESURÉ au banc, robot immobile : objet posé à 30 cm en arrière-gauche, donc
  # attendu à +135°, rapporté par le capteur à -45°. Un demi-tour franc, et une
  # rotation et non un miroir — un miroir aurait donné -135° (retourné) ou +45°
  # (balayage inversé). Sans cette correction le SLAM cartographie la pièce à
  # l'envers et nav2 planifie sur des obstacles fantômes.
  mount_rpy: [0.0, 0.0, 3.141592653589793]
  rotation_hz: 10            # 8-12 Hz possibles
  samples_per_rev: 500       # 5 kHz / 10 Hz, soit 0.72°
  range_min: 0.05
  range_max: 12.0            # objet blanc ; 6.0 sur objet noir
  range_resolution: 0.015
  accuracy: 0.030            # ±30 mm
  noise_stddev: 0.015        # ≈ 2 sigma pour ±30 mm
  serial_baudrate: 460800    # propre au C1

# BNO055 en mode IMU (6 axes, magnétomètre coupé). Le Pico transmet les
# entiers bruts ; la conversion SI se fait côté Pi avec ces facteurs
# (registre UNIT_SEL = 0x00 du composant).
imu:
  frame: imu_link
  accel_lsb_per_m_s2: 100
  gyro_lsb_per_deg_s: 16

# Contrat avec diffdrive_pico_firmware : cadence des trames S et délai du
# chien de garde. L'interface matérielle doit émettre bien plus vite que ce
# délai, y compris à l'arrêt.
pico:
  frame_rate_hz: 50
  watchdog_ms: 300
