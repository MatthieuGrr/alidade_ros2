# Docking sur le cube ArUco : approche jusqu'a un ecart fixe devant une face.
# Gabarit rendu au lancement ; chaque bloc est passe a son noeud.
#
#   cube_detector.py   /aruco_detections -> /cube/dock_pose : ou base_footprint
#                      doit s'arreter, face au cote du cube le plus tourne vers
#                      le robot (alidade_bringup/cube.py, dock_target)
#   cube_docking.py    actions /dock_robot et /undock_robot : mise en place dans
#                      l'axe de la face, puis approche asservie sur la vision
#                      jusqu'a la ligne d'arret (alidade_bringup/docking.py)
#
# Arret a 5 cm de la face du cube. De si pres, le bas de l'image coupe le
# cube : la fin d'approche se fait a l'odometrie sur la derniere cible vue
# (blind_distance). La camera voit le cube entier de 10 cm a environ 1 m.
cube_detector:
  ros__parameters:
    use_sim_time: ${use_sim_time}
    # m, face du cube -> face avant du robot, a l'arret. A 5 cm, seul le dessus
    # du cube est encore dans l'image (voir blind_distance plus bas).
    gap: 0.05
    front_x: ${footprint.front_x} # m, base_footprint -> face avant du robot
    hysteresis_deg: 15.0          # changement de face vise : il faut mieux de 15 degres

cube_docking:
  ros__parameters:
    use_sim_time: ${use_sim_time}
    # Mise en place 20 cm en retrait de l'arret, soit 30 cm d'ecart : le cube
    # y est au milieu du champ, et l'approche finale presque droite.
    staging: 0.20
    # Planchers mesures sur le robot : en dessous, les roues calent ou
    # demarrent l'une apres l'autre (voir alidade_bringup/docking.py).
    v_max: 0.08                   # m/s
    v_min: 0.05                   # m/s
    w_max: 0.8                    # rad/s
    w_min: 0.45                   # rad/s
    k_v: 1.0                      # 1/s, ralentissement a l'approche d'un point
    k_yaw: 2.0                    # 1/s, correction de cap
    k_lat: 10.0                   # 1/m, ecart lateral -> cap de rattrapage
    lateral_tolerance: 0.015      # m, arrivee acceptee...
    yaw_tolerance_deg: 5.0        # ... sinon reprise depuis la mise en place
    max_retries: 2
    # Fin d'approche a l'odometrie quand le cube sort du champ a moins de
    # cette distance de la ligne d'arret. Mesure sur le robot, camera a 23.5
    # deg : la face tournee vers le robot disparait entre 11 et 7.5 cm
    # d'ecart, le dessus entre 5.5 et 4 cm.
    blind_distance: 0.04          # m
    detection_timeout: 1.0        # s sans detection : cube perdu
    # Age reel d'une detection a sa reception, MESURE par une rotation sur
    # place (debut du mouvement vu par l'odometrie, puis par la camera). On ne
    # se sert PAS de l'horodatage de l'image : usb_cam la date d'environ 0.5 s
    # trop tot (790 ms d'age apparent pour 300 ms reels).
    detection_latency: 0.35
    # Lissage de la cible dans odom, a 15 Hz : centre du cube vite, cap de la
    # face lentement (il bascule de +-8 degres d'une image a l'autre).
    filter_position: 0.3
    filter_yaw: 0.1
    undock_distance: 0.15         # m, recul du degagement
    stage_timeout: 30.0
    rate: 20.0
