# Exploration par frontieres (frontier_exploration_ros2, clone par
# system/sources.sh). Gabarit rendu au lancement. Les valeurs par defaut du
# paquet visent un TurtleBot3 Waffle ; ici un robot de 15 cm de rayon dans une
# piece de 6 m avec un LiDAR de 12 m. L'explorateur ne fait rien tant que le
# gestionnaire de modes ne l'a pas demarre (mode EXPLORATION) et publie un
# evenement de fin sur /exploration_complete.
frontier_explorer:
  ros__parameters:
    use_sim_time: ${use_sim_time}

    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    frontier_marker_scale: 0.15

    # slam_toolbox publie /map en transient_local ; l'autodetection couvre un
    # changement de QoS sans casser la souscription.
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: true
    map_qos_autodetect_timeout_s: 5.0
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    map_processing_rate_hz: 1.0
    autostart: false
    control_service_enabled: true
    completion_event_enabled: true
    completion_event_topic: /exploration_complete
    escape_enabled: true
    # L'explorateur ramene lui-meme le robot a son point de depart ; le
    # gestionnaire sauvegarde la carte et repasse en MAPPING.
    return_to_start_on_complete: true

    mrtsp_solver: dp
    dp_solver_candidate_limit: 12
    dp_planning_horizon: 8
    frontier_map_optimization_enabled: true
    goal_preemption_enabled: true
    goal_preemption_min_interval_s: 2.0
    goal_skip_on_blocked_goal: true
    # SLAM a 10 Hz sur un petit robot : on laisse la carte se poser apres
    # chaque frontiere plutot que de courir a la suivante.
    post_goal_settle_enabled: true
    post_goal_min_settle: 1.0
    frontier_suppression_enabled: true
    all_frontiers_suppressed_behavior: return_to_start

    weight_distance_wd: 1.0
    weight_gain_ws: 1.0
    max_linear_speed_vmax: ${motor.max_linear_velocity}
    max_angular_speed_wmax: ${motor.max_angular_velocity}
    sensor_effective_range_m: 3.0

    # 2.5 fois le rayon du robot (0.15 m).
    frontier_selection_min_distance: 0.4
    frontier_candidate_min_goal_distance_m: 0.4
    frontier_visit_tolerance: 0.3
    occ_threshold: 65
    min_frontier_size_cells: 5        # 25 cm a 5 cm par cellule
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1

    goal_preemption_complete_if_within_m: 0.4
    goal_preemption_lidar_range_m: ${lidar.range_max}
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 1.0
    goal_preemption_lidar_min_reveal_length_m: 0.5
    goal_preemption_lidar_yaw_offset_deg: 0.0

    frontier_suppression_attempt_threshold: 2
    frontier_suppression_base_size_m: 1.0
    frontier_suppression_expansion_size_m: 0.5
    frontier_suppression_timeout_s: 90.0
    frontier_suppression_no_progress_timeout_s: 20.0
    frontier_suppression_progress_epsilon_m: 0.15
    frontier_suppression_startup_grace_period_s: 15.0
    frontier_suppression_max_attempt_records: 256
    frontier_suppression_max_regions: 64
