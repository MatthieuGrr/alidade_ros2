# Camera C920 : pilote usb_cam. Gabarit rendu au lancement ; le bloc est passe
# explicitement au composant par camera.launch.py, le nom de noeud n'a pas a
# coincider.
#
# La camera est montee a l'endroit : l'image du pilote est deja droite, dans le
# repere optique de la CAO. En mjpeg2rgb, usb_cam decode le MJPEG de la camera
# et image_transport en reencode un JPEG sur image_raw/compressed, pour l'interface.
usb_cam:
  ros__parameters:
    use_sim_time: ${use_sim_time}
    video_device: ${camera.device}
    framerate: ${camera.fps}
    io_method: mmap
    frame_id: ${camera.frame}
    pixel_format: ${camera.pixel_format}
    av_device_format: YUV422P
    image_width: ${camera.width}
    image_height: ${camera.height}
    camera_name: alidade_c920
    camera_info_url: package://alidade_description/config/${camera.calibration}
    autofocus: ${camera.autofocus}
    focus: ${camera.focus}
    autoexposure: true
    auto_white_balance: true
