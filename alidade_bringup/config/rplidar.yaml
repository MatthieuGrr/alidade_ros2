# RPLIDAR C1 via rplidar_ros (paquet apt ros-jazzy-rplidar-ros).
# Gabarit rendu au lancement.
rplidar:
  ros__parameters:
    use_sim_time: ${use_sim_time}
    channel_type: serial
    serial_port: /dev/rplidar
    serial_baudrate: ${lidar.serial_baudrate}
    frame_id: ${lidar.frame}
    # `inverted` fait un MIROIR du balayage : ce n'est pas ce qu'il nous faut,
    # et le laisser a false est correct.
    inverted: false
    # CE demi-tour-ci, en revanche, est indispensable. Le driver publie
    # theta_ros = pi - theta_brut :
    #
    #     scan_msg->angle_min = M_PI - angle_max;
    #     scan_msg->angle_max = M_PI - angle_min;
    #
    # Or la conversion juste, fleche du capteur alignee sur +x, est
    # theta_ros = -theta_brut : Slamtec compte les angles dans le sens HORAIRE
    # (repere gaucher, datasheet C1 figure 1-2, ou le 0 est la fleche du dessus,
    # a l'oppose du cable), ROS dans le sens trigonometrique. L'ecart vaut donc
    # exactement +pi, et c'est une convention du DRIVER, pas un defaut de
    # montage ni du capteur.
    #
    # Verifie sur le robot : objet pose a +135 deg (arriere-gauche), rapporte a
    # -45 deg. Un objet a +135 ROS est a 225 deg horaire depuis la fleche, et
    # 180 - 225 = -45. Au degre pres.
    #
    # `flip_x_axis` decale l'indice d'une demi-revolution, ce qui annule
    # exactement ce demi-tour. La correction vit ICI et non dans l'URDF : le
    # modele doit decrire le materiel, pas compenser un pilote. Avant, une
    # rotation de pi trainait dans lidar.mount_rpy et faisait chercher un
    # capteur monte a l'envers qui n'a jamais existe.
    flip_x_axis: true
    auto_standby: false
    # Reechantillonne chaque tour a un nombre de points fixe. Sans cela le
    # nombre de points varie d'un tour a l'autre (≈ 500 ± 5) et slam_toolbox
    # rejette les scans dont la taille change : « LaserRangeScan contains N
    # range readings, expected M ». VERIFIE sur le C1 : 360 points a 1.000°,
    # le pilote prenant int(1e6 / us_per_sample / 10 / 360) = 1 multiple de
    # 360 ; les ~500 echantillons bruts (0.72°) ne sont pas conserves.
    angle_compensate: true
