# La « pierre » : element de jeu de la Coupe de France de robotique, cible du
# docking. Boite carton de 320 x 110 x 110 mm pesant 90 g -- assez legere pour
# qu'un contact la deplace, d'ou une approche qui s'arrete AVANT de la toucher.
#
# Les QUATRE grandes faces (320 x 110) portent le MEME marqueur, centre. Les
# deux petites (110 x 110) n'en portent aucun : robot dans l'axe long d'une
# pierre, aucune detection. C'est une contrainte du jeu, pas un defaut.
#
# Consequence de ce marqueur unique : le filtrage par identifiant ne distingue
# plus rien, ni les faces entre elles, ni les pierres entre elles. Toute la
# desambiguisation est geometrique (alidade_bringup/stone.py).
#
# Une pierre COUCHEE ne montre qu'une seule face utile a la fois : les deux
# faces laterales sont opposees, celle du dessus est horizontale et celle du
# dessous porte sur le plateau. Rien a fusionner, contrairement au cube : un
# marqueur vu = une pierre candidate.
name: pierre

# Longueur, largeur, hauteur, en m. Les hauteurs de marqueur s'en deduisent
# (stone.py : lying, stacked, standing) plutot que d'etre recopiees ici : une
# cote qui change ne doit pas laisser une constante perimee derriere elle.
size: [0.320, 0.110, 0.110]
mass: 0.090

marker:
  dict: 4X4_50
  id: 13              # 11-50 sont reserves a l'aire de jeu, 1-10 aux robots
  size: 0.080         # cote du CARRE NOIR, bordure blanche exclue : c'est lui
                      # qui fixe l'echelle, donc les distances
  quiet: 0.010        # marge blanche autour, soit un pave imprime de 100 mm
